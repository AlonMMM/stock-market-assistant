<title>SMA Board</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: a trading desk's work board. Four parts side by side (Analysis, Research,
   App, Data & Infra), stacked behind tabs on a phone; each item a compact ticket with
   its status stamped on the left edge. Items live in the page's store (items/<id>),
   mirrored from docs/backlog.md. */
  :root {
    --bg: #eef0ec;
    --panel: #ffffff;
    --sunk: #f6f7f4;
    --ink: #15241f;
    --muted: #5b6b65;
    --line: #d9dfd8;
    --accent: #1d6b5c;
    --analysis: #8a4b0f;
    --research: #2a5ba8;
    --app: #6b3fa0;
    --infra: #2f6b45;
    --open: #5b6b65;
    --open-soft: #e9ece7;
    --active: #b45309;
    --active-soft: #fbefd9;
    --waiting: #9b1c1c;
    --waiting-soft: #fbeaea;
    --done: #1d6b3a;
    --done-soft: #e1f2e7;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c;
      --panel: #1c2027;
      --sunk: #181b21;
      --ink: #e5e8eb;
      --muted: #8e97a2;
      --line: #2b3039;
      --accent: #5cc9b0;
      --analysis: #f0a95a;
      --research: #8fb4f2;
      --app: #c3a2ef;
      --infra: #7fd19c;
      --open: #9aa3ad;
      --open-soft: #262b33;
      --active: #f0b45a;
      --active-soft: #2d2412;
      --waiting: #f08b8b;
      --waiting-soft: #331b1d;
      --done: #7fd19c;
      --done-soft: #17291f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c;
    --panel: #1c2027;
    --sunk: #181b21;
    --ink: #e5e8eb;
    --muted: #8e97a2;
    --line: #2b3039;
    --accent: #5cc9b0;
    --analysis: #f0a95a;
    --research: #8fb4f2;
    --app: #c3a2ef;
    --infra: #7fd19c;
    --open: #9aa3ad;
    --open-soft: #262b33;
    --active: #f0b45a;
    --active-soft: #2d2412;
    --waiting: #f08b8b;
    --waiting-soft: #331b1d;
    --done: #7fd19c;
    --done-soft: #17291f;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 var(--body);
  }
  .wrap {
    max-width: 1500px;
    margin: 0 auto;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 16px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
  }
  h1 {
    font: 700 26px/1.1 var(--display);
    letter-spacing: 0.01em;
    margin: 0;
  }
  .sub {
    color: var(--muted);
    margin: 4px 0 0;
    max-width: 70ch;
  }
  .tally {
    display: flex;
    gap: 14px;
    font: 500 12px var(--mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }
  .tally b {
    color: var(--ink);
    font-weight: 500;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  input,
  select,
  textarea,
  button {
    font: inherit;
    color: inherit;
  }
  input[type="search"],
  select,
  .field input,
  .field textarea,
  .field select {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    min-width: 0;
  }
  input[type="search"] {
    flex: 1 1 220px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
    font-size: 13px;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
    min-height: 1.2em;
  }
  .note.err {
    color: var(--waiting);
  }
  .tabs {
    display: none;
    gap: 6px;
    overflow-x: auto;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    align-items: start;
  }
  .part {
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    display: grid;
    gap: 10px;
    min-width: 0;
  }
  .part-head {
    display: grid;
    gap: 2px;
    border-top: 3px solid var(--tone);
    padding-top: 8px;
  }
  .part-head h2 {
    margin: 0;
    font: 700 17px/1.2 var(--display);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--tone);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .part-head h2 span {
    font: 500 12px var(--mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .part-head p {
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
  }
  .list {
    display: grid;
    gap: 8px;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 14px 12px;
  }
  .ticket {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--st);
    border-radius: 8px;
    min-width: 0;
  }
  .ticket summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 12px;
    display: grid;
    gap: 6px;
  }
  .ticket summary::-webkit-details-marker {
    display: none;
  }
  .t-title {
    font-weight: 600;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .pill {
    font: 500 11px var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 4px;
    color: var(--st);
    background: var(--st-soft);
  }
  .tag {
    font-size: 11.5px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .wait {
    font-size: 12.5px;
    color: var(--waiting);
    overflow-wrap: anywhere;
  }
  .body {
    padding: 0 12px 12px;
    display: grid;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .notes {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 0;
  }
  .kv {
    font-size: 12.5px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .kv b {
    color: var(--ink);
    font-weight: 500;
  }
  .log {
    font-family: var(--mono);
    font-size: 12px;
  }
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--panel);
  }
  .btn.danger {
    color: var(--waiting);
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .add {
    justify-self: start;
  }
  form.edit {
    display: grid;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  .field {
    display: grid;
    gap: 3px;
    font-size: 12px;
    color: var(--muted);
  }
  .field textarea {
    min-height: 90px;
    resize: vertical;
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  [data-st="open"] {
    --st: var(--open);
    --st-soft: var(--open-soft);
  }
  [data-st="active"] {
    --st: var(--active);
    --st-soft: var(--active-soft);
  }
  [data-st="waiting"] {
    --st: var(--waiting);
    --st-soft: var(--waiting-soft);
  }
  [data-st="done"] {
    --st: var(--done);
    --st-soft: var(--done-soft);
  }
  @media (max-width: 1100px) {
    .board {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 640px) {
    .tabs {
      display: flex;
    }
    .board {
      grid-template-columns: minmax(0, 1fr);
    }
    .board .part:not(.shown) {
      display: none;
    }
    .row2 {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>SMA Board</h1>
      <p class="sub">
        What we watch, what the research left open, the app, and how we run it.
        Bugs live on their own dashboard. The repo's docs/backlog.md holds the
        same items.
      </p>
    </div>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>

  <div class="bar" role="group" aria-label="Filters">
    <input
      type="search"
      id="q"
      placeholder="Search titles, notes, tags"
      aria-label="Search"
    />
    <button class="chip" type="button" data-f="all" aria-pressed="true">
      All open
    </button>
    <button class="chip" type="button" data-f="active" aria-pressed="false">
      Active
    </button>
    <button class="chip" type="button" data-f="waiting" aria-pressed="false">
      Waiting
    </button>
    <button class="chip" type="button" data-f="done" aria-pressed="false">
      Done
    </button>
    <select id="tag" aria-label="Tag">
      <option value="">Every tag</option>
    </select>
  </div>
  <div class="note" id="note" role="status"></div>

  <div class="tabs" id="tabs" role="tablist" aria-label="Parts"></div>
  <div class="board" id="board"></div>
</div>

<script>
  (() => {
    const PARTS = [
      {
        key: "analysis",
        name: "Analysis",
        tone: "var(--analysis)",
        blurb:
          "From watching the charts and the trades: questions, things that look off, ideas.",
      },
      {
        key: "research",
        name: "Research",
        tone: "var(--research)",
        blurb:
          "Open threads in the logs: candidates waiting for a yes, near misses, tests not deep enough.",
      },
      {
        key: "app",
        name: "App",
        tone: "var(--app)",
        blurb:
          "The application: how it looks and works, and the backend behind it.",
      },
      {
        key: "infra",
        name: "Data & Infra",
        tone: "var(--infra)",
        blurb: "The data, the infrastructure, and running it from anywhere.",
      },
    ];
    const STATUSES = ["open", "active", "waiting", "done"];
    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, kids = []) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === "text") n.textContent = v;
        else if (k === "data") Object.assign(n.dataset, v);
        else if (k in n && k !== "list") n[k] = v;
        else n.setAttribute(k, v);
      }
      for (const c of [].concat(kids)) if (c) n.append(c);
      return n;
    };
    const store = (k, v) => {
      try {
        if (v === undefined) return localStorage.getItem(k);
        localStorage.setItem(k, v);
      } catch {}
      return null;
    };

    let db = null;
    let canWrite = false;
    let items = [];
    let filter = store("sma-board-filter") || "all";
    let tagFilter = "";
    let query = "";
    let shownPart = store("sma-board-part") || "analysis";
    const open = new Set();
    let editing = null; // {id} or {part, isNew: true}
    let confirmDelete = null;

    const say = (msg, err) => {
      $("note").textContent = msg || "";
      $("note").classList.toggle("err", !!err);
    };
    const slug = (s) =>
      s
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 60) || "item";
    const byRank = (a, b) =>
      (a.rank ?? 999) - (b.rank ?? 999) ||
      String(a.title).localeCompare(b.title);
    const inPart = (key) => items.filter((x) => x.part === key).sort(byRank);

    async function write(fn, ok) {
      if (!db || !canWrite) {
        say("You can view this board but not change it.", true);
        return;
      }
      try {
        say("Saving…");
        await fn();
        say(ok || "Saved.");
      } catch (e) {
        say(
          e && e.code === "not_granted"
            ? "Saving is not allowed for you on this board."
            : "That change was not saved. Try again.",
          true,
        );
      }
    }
    const touch = (patch) => ({ ...patch, updated: new Date().toISOString() });

    function matches(it) {
      if (filter === "all" && it.status === "done") return false;
      if (filter !== "all" && it.status !== filter) return false;
      if (tagFilter && !(it.tags || []).includes(tagFilter)) return false;
      if (query) {
        const hay = [
          it.title,
          it.notes,
          it.waiting,
          it.log,
          it.source,
          ...(it.tags || []),
        ]
          .join(" ")
          .toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    }

    function editForm(it, part) {
      const isNew = !it;
      const v = it || {
        title: "",
        status: "open",
        tags: [],
        waiting: "",
        log: "",
        notes: "",
        part,
      };
      const id = isNew ? `new-${part}` : it.id;
      const f = el("form", { className: "edit" });
      const title = el("input", {
        id: `f-title-${id}`,
        value: v.title,
        required: true,
      });
      const status = el(
        "select",
        { id: `f-status-${id}` },
        STATUSES.map((s) =>
          el("option", { value: s, text: s, selected: s === v.status }),
        ),
      );
      const partSel = el(
        "select",
        { id: `f-part-${id}` },
        PARTS.map((p) =>
          el("option", {
            value: p.key,
            text: p.name,
            selected: p.key === (v.part || part),
          }),
        ),
      );
      const tags = el("input", {
        id: `f-tags-${id}`,
        value: (v.tags || []).join(", "),
        placeholder: "Main bot, Exits",
      });
      const waiting = el("input", {
        id: `f-wait-${id}`,
        value: v.waiting || "",
        placeholder: "Blocked on…",
      });
      const log = el("input", {
        id: `f-log-${id}`,
        value: v.log || "",
        placeholder: "best-algorithms.md: heading",
      });
      const notes = el("textarea", {
        id: `f-notes-${id}`,
        value: v.notes || "",
      });
      const lab = (text, input) =>
        el("label", { className: "field" }, [text, input]);
      f.append(
        lab(
          part === "analysis" && isNew
            ? "What did you see, or what is the question?"
            : "Title",
          title,
        ),
        el("div", { className: "row2" }, [
          lab("Status", status),
          lab("Part", partSel),
        ]),
        lab("Tags, comma-separated", tags),
        lab("Waiting on", waiting),
        lab("Research log entry", log),
        lab("Notes", notes),
        el("div", { className: "tools" }, [
          el("button", {
            className: "btn primary",
            type: "submit",
            text: isNew ? "Add" : "Save",
          }),
          el("button", {
            className: "btn",
            type: "button",
            text: "Cancel",
            onclick: () => {
              editing = null;
              render();
            },
          }),
        ]),
      );
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        const t = title.value.trim();
        if (!t) return;
        const now = new Date().toISOString();
        const data = {
          title: t,
          status: status.value,
          part: partSel.value,
          tags: tags.value
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean),
          waiting: waiting.value.trim(),
          log: log.value.trim(),
          notes: notes.value.trim(),
        };
        if (isNew) {
          let key = slug(t);
          while (items.some((x) => x.id === key)) key += "-2";
          const rank = inPart(data.part).length + 1;
          write(async () => {
            await db
              .collection("items")
              .doc(key)
              .set({
                ...data,
                rank,
                source: `Added on the board, ${now.slice(0, 10)}`,
                done: "",
                created: now,
                updated: now,
              });
            editing = null;
          }, "Added.");
        } else {
          const moved = data.part !== it.part;
          if (moved) data.rank = inPart(data.part).length + 1;
          if (data.status === "done" && !it.done)
            data.done = `${now.slice(0, 10)}, on the board`;
          write(async () => {
            await db.collection("items").doc(it.id).update(touch(data));
            editing = null;
          });
        }
      });
      return f;
    }

    async function move(it, dir) {
      const list = inPart(it.part);
      const i = list.findIndex((x) => x.id === it.id);
      const j = i + dir;
      if (j < 0 || j >= list.length) return;
      const reordered = list.slice();
      [reordered[i], reordered[j]] = [reordered[j], reordered[i]];
      write(async () => {
        for (let k = 0; k < reordered.length; k++)
          if (reordered[k].rank !== k + 1)
            await db
              .collection("items")
              .doc(reordered[k].id)
              .update({ rank: k + 1 });
      }, "Moved.");
    }

    function ticket(it, idx, count) {
      if (editing && editing.id === it.id) return editForm(it, it.part);
      const d = el("details", {
        className: "ticket",
        data: { st: STATUSES.includes(it.status) ? it.status : "open" },
      });
      d.open = open.has(it.id);
      d.addEventListener("toggle", () =>
        d.open ? open.add(it.id) : open.delete(it.id),
      );
      const meta = el("div", { className: "meta" }, [
        el("span", { className: "pill", text: it.status || "open" }),
        ...(it.tags || []).map((t) =>
          el("span", { className: "tag", text: t }),
        ),
      ]);
      d.append(
        el("summary", {}, [
          el("span", { className: "t-title", text: it.title }),
          meta,
          it.waiting
            ? el("span", { className: "wait", text: `Waiting: ${it.waiting}` })
            : null,
        ]),
      );
      const body = el("div", { className: "body" });
      if (it.notes)
        body.append(el("p", { className: "notes", text: it.notes }));
      if (it.log)
        body.append(
          el("div", { className: "kv" }, [
            el("b", { text: "Log " }),
            el("span", { className: "log", text: it.log }),
          ]),
        );
      if (it.source)
        body.append(
          el("div", { className: "kv" }, [
            el("b", { text: "From " }),
            it.source,
          ]),
        );
      if (it.done)
        body.append(
          el("div", { className: "kv" }, [el("b", { text: "Done " }), it.done]),
        );
      if (canWrite) {
        const statusSel = el(
          "select",
          { id: `s-${it.id}`, "aria-label": "Status" },
          STATUSES.map((s) =>
            el("option", { value: s, text: s, selected: s === it.status }),
          ),
        );
        statusSel.addEventListener("change", () => {
          const patch = { status: statusSel.value };
          if (statusSel.value === "done" && !it.done)
            patch.done = `${new Date().toISOString().slice(0, 10)}, on the board`;
          write(() => db.collection("items").doc(it.id).update(touch(patch)));
        });
        const tools = el("div", { className: "tools" }, [
          statusSel,
          el("button", {
            className: "btn",
            type: "button",
            text: "↑",
            "aria-label": "Move up",
            disabled: idx === 0,
            onclick: () => move(it, -1),
          }),
          el("button", {
            className: "btn",
            type: "button",
            text: "↓",
            "aria-label": "Move down",
            disabled: idx === count - 1,
            onclick: () => move(it, 1),
          }),
          el("button", {
            className: "btn",
            type: "button",
            text: "Edit",
            onclick: () => {
              editing = { id: it.id };
              render();
            },
          }),
        ]);
        if (confirmDelete === it.id) {
          tools.append(
            el("button", {
              className: "btn danger",
              type: "button",
              text: "Delete for good",
              onclick: () =>
                write(async () => {
                  confirmDelete = null;
                  open.delete(it.id);
                  await db.collection("items").doc(it.id).delete();
                }, "Deleted."),
            }),
            el("button", {
              className: "btn",
              type: "button",
              text: "Keep",
              onclick: () => {
                confirmDelete = null;
                render();
              },
            }),
          );
        } else {
          tools.append(
            el("button", {
              className: "btn danger",
              type: "button",
              text: "Delete",
              onclick: () => {
                confirmDelete = it.id;
                render();
              },
            }),
          );
        }
        body.append(tools);
      }
      d.append(body);
      return d;
    }

    function render() {
      // Tally and tag list.
      const tally = $("tally");
      tally.replaceChildren(
        ...[
          ["open", items.filter((x) => x.status === "open").length],
          ["active", items.filter((x) => x.status === "active").length],
          ["waiting", items.filter((x) => x.status === "waiting").length],
          ["done", items.filter((x) => x.status === "done").length],
        ].map(([k, n]) =>
          el("span", {}, [el("b", { text: String(n) }), ` ${k}`]),
        ),
      );
      const tags = [...new Set(items.flatMap((x) => x.tags || []))].sort();
      if (tagFilter && !tags.includes(tagFilter)) tagFilter = "";
      $("tag").replaceChildren(
        el("option", { value: "", text: "Every tag" }),
        ...tags.map((t) =>
          el("option", { value: t, text: t, selected: t === tagFilter }),
        ),
      );
      document
        .querySelectorAll(".chip")
        .forEach((c) =>
          c.setAttribute("aria-pressed", String(c.dataset.f === filter)),
        );

      // Tabs (phone).
      $("tabs").replaceChildren(
        ...PARTS.map((p) =>
          el("button", {
            className: "chip",
            type: "button",
            role: "tab",
            "aria-selected": String(p.key === shownPart),
            "aria-pressed": String(p.key === shownPart),
            text: `${p.name} ${inPart(p.key).filter(matches).length}`,
            onclick: () => {
              shownPart = p.key;
              store("sma-board-part", p.key);
              render();
            },
          }),
        ),
      );

      // Parts.
      $("board").replaceChildren(
        ...PARTS.map((p) => {
          const all = inPart(p.key);
          const list = all.filter(matches);
          const sec = el("section", {
            className: `part${p.key === shownPart ? " shown" : ""}`,
            "aria-label": p.name,
          });
          sec.style.setProperty("--tone", p.tone);
          sec.append(
            el("div", { className: "part-head" }, [
              el("h2", {}, [p.name, el("span", { text: String(list.length) })]),
              el("p", { text: p.blurb }),
            ]),
          );
          const box = el("div", { className: "list" });
          if (list.length)
            list.forEach((it) =>
              box.append(ticket(it, all.indexOf(it), all.length)),
            );
          else
            box.append(
              el("div", {
                className: "empty",
                text: all.length
                  ? "Nothing here matches the filters."
                  : p.key === "analysis"
                    ? "Nothing yet. Add what you notice on a chart or a trade: a question, something that looks off, an idea."
                    : "Nothing yet.",
              }),
            );
          sec.append(box);
          if (canWrite) {
            if (editing && editing.isNew && editing.part === p.key)
              sec.append(editForm(null, p.key));
            else
              sec.append(
                el("button", {
                  className: "btn add",
                  type: "button",
                  text: `+ Add to ${p.name}`,
                  onclick: () => {
                    editing = { isNew: true, part: p.key };
                    render();
                  },
                }),
              );
          }
          return sec;
        }),
      );
    }

    // Filters.
    document.querySelectorAll(".chip[data-f]").forEach((c) =>
      c.addEventListener("click", () => {
        filter = c.dataset.f;
        store("sma-board-filter", filter);
        render();
      }),
    );
    $("tag").addEventListener("change", () => {
      tagFilter = $("tag").value;
      render();
    });
    let typing;
    $("q").addEventListener("input", () => {
      clearTimeout(typing);
      typing = setTimeout(() => {
        query = $("q").value.trim().toLowerCase();
        render();
      }, 120);
    });

    say("Loading the board…");
    render();

    (async () => {
      db = await window.claude?.use?.("db");
      if (!db) {
        say(
          "The board could not be loaded here. Open it signed in to claude.ai.",
          true,
        );
        return;
      }
      const user = await window.claude.use("user");
      const may = user ? await user.can("data.write") : null;
      canWrite = may !== false;
      const timer = setTimeout(
        () => say("The board is slow to load. Reload the page.", true),
        10000,
      );
      db.collection("items").onSnapshot(
        (snap) => {
          clearTimeout(timer);
          items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          say(
            items.length
              ? ""
              : "The board is empty. Add the first item to any part.",
          );
          render();
        },
        (e) => {
          clearTimeout(timer);
          say(
            e && e.code === "revoked"
              ? "This board is no longer shared with you."
              : "The board stopped updating. Reload the page.",
            true,
          );
        },
      );
    })();
  })();
</script>
