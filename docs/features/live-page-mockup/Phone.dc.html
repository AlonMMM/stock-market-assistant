<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live page – phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f4f5ef; color: #142b29; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.4; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -2px">SMA<span style="color: #9cdc52">.</span></span>
      <button type="button" aria-label="Connection status: live" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 11px; border: 1px solid #b8d9bf; border-radius: 999px; background: #eaf5ec; color: #14532d; font: inherit; font-size: 13px; font-weight: 600">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.18)"></span>Live
      </button>
    </div>
    <nav aria-label="Data mode" style="display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #cdd7ce; border-radius: 999px; font-size: 13px">
      <span aria-current="page" style="padding: 8px 12px; border-radius: 999px; background: #142b29; color: #ffffff; font-weight: 650">Live</span>
      <button type="button" style="padding: 8px 12px; border: 0; border-radius: 999px; background: transparent; color: #142b29; font: inherit">Backtest</button>
    </nav>
  </header>

  <section aria-label="Market" style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid #cdd7ce; border-radius: 12px; background: #fafbf8">
    <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px">
      <span><strong>QQQ</strong> <span style="color: #15803d; font-weight: 600">▲ +0.42%</span></span>
      <span><strong>SPY</strong> <span style="color: #15803d; font-weight: 600">▲ +0.31%</span></span>
      <span style="color: #3f4f4c">Regular · to 23:00</span>
    </div>
    <div style="display: flex; height: 6px; gap: 2px; border-radius: 3px; overflow: hidden" aria-hidden="true">
      <span style="flex: 5.5; background: #d9e3d6"></span>
      <span style="flex: 1.25; background: #142b29"></span>
      <span style="flex: 5.25; background: #9fbf8a"></span>
      <span style="flex: 4; background: #d9e3d6"></span>
    </div>
  </section>

  <div role="tablist" aria-label="Live sections" style="display: flex; border-bottom: 1px solid #cdd7ce">
    <button type="button" role="tab" aria-selected="true" style="flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px; margin-bottom: -1px; border: 0; border-bottom: 2px solid #142b29; border-radius: 0; background: transparent; color: #142b29; font: inherit; font-size: 15px; font-weight: 650">Alerts <span style="padding: 1px 7px; border-radius: 999px; background: #142b29; color: #ffffff; font-size: 12px">7</span></button>
    <button type="button" role="tab" aria-selected="false" style="flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: #526461; font: inherit; font-size: 15px">Watchlist <span style="padding: 1px 7px; border-radius: 999px; background: #e1e8e1; color: #3f4f4c; font-size: 12px">30</span></button>
  </div>

  <div style="display: flex; gap: 8px; align-items: center">
    <div role="group" aria-label="Direction" style="display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #cdd7ce; border-radius: 10px; background: #fafbf8">
      <button type="button" aria-pressed="true" style="min-height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: #142b29; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600">All 7</button>
      <button type="button" aria-pressed="false" style="min-height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: #142b29; font: inherit; font-size: 13px">▲ 4</button>
      <button type="button" aria-pressed="false" style="min-height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: #142b29; font: inherit; font-size: 13px">▼ 3</button>
    </div>
    <label style="flex: 1; min-width: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Symbol</span>
      <select style="width: 100%; min-height: 40px; padding: 0 8px; border: 1px solid #b9c8bf; border-radius: 10px; background: #fafbf8; color: #142b29; font: inherit; font-size: 14px"><option>All symbols</option></select>
    </label>
    <button type="button" aria-label="Sort" style="min-width: 40px; min-height: 40px; border: 1px solid #b9c8bf; border-radius: 10px; background: #fafbf8; color: #142b29; display: inline-flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3v10M2.5 10.5L5 13l2.5-2.5M11 13V3M8.5 5.5L11 3l2.5 2.5"></path></svg>
    </button>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; border: 1px solid #cdd7ce; border-bottom: 0; border-radius: 14px 14px 0 0; background: #fafbf8">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <h3 style="margin: 0; padding: 8px 14px; font-size: 12px; font-weight: 600; background: #f1f4ee; border-bottom: 1px solid #e1e8e1">{{ g.title }} <span style="font-weight: 400; color: #526461">{{ g.sub }}</span></h3>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
          <li style="border-bottom: 1px solid #e1e8e1">
            <button type="button" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; width: 100%; padding: 10px 14px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left">
              <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
                <strong style="font-size: 16px">{{ r.tk }}</strong>
                <span style="{{ r.dirStyle }}">{{ r.dirText }}</span>
                <sc-if value="{{ r.isNew }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 650; color: #1e4f86; background: #e2ecf7; border-radius: 6px; padding: 1px 6px">New</span></sc-if>
              </span>
              <span style="color: #3f4f4c; font-variant-numeric: tabular-nums">{{ r.t }}</span>
              <span style="grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3f4f4c">
                <strong style="color: #142b29; font-variant-numeric: tabular-nums">{{ r.ratio }}</strong> volume
                <span style="flex: 0 0 70px; height: 5px; border-radius: 3px; background: #e1e8e1; overflow: hidden"><span style="{{ r.meterStyle }}"></span></span>
                <span>· vs SPY×β <strong style="{{ r.exStyle }}">{{ r.ex }}</strong></span>
              </span>
            </button>
          </li>
        </sc-for>
      </ul>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function pct(n) { return (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(2) + '%'; }
    function r(t, tk, move, ratio, ex, isNew) {
      return {
        t: t, tk: tk, isNew: !!isNew, ratio: ratio.toFixed(1) + '×', ex: pct(ex),
        dirText: (move >= 0 ? '▲ ' : '▼ ') + pct(move),
        dirStyle: 'padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: 600; ' + (move >= 0 ? 'background: #e3f1e6; color: #14642f' : 'background: #f8e4e2; color: #9f1a1a'),
        meterStyle: 'display: block; height: 100%; background: #142b29; width: ' + Math.min(100, ratio / 8 * 100).toFixed(0) + '%',
        exStyle: 'color: ' + (ex >= 0 ? '#15803d' : '#b91c1c')
      };
    }
    return {
      groups: [
        { title: 'Regular session', sub: '· 5 alerts', rows: [r('17:42', 'NVDA', 1.84, 5.1, 1.2, true), r('17:38', 'AMD', 1.12, 3.4, 0.71, true), r('17:21', 'TSLA', -2.05, 4.0, -2.62), r('17:05', 'NVDA', 0.92, 3.1, 0.48), r('16:41', 'AAPL', -0.62, 3.8, -0.8)] },
        { title: 'Pre-market', sub: '· 2 alerts', rows: [r('15:12', 'PLTR', 2.4, 6.2, 2.1), r('14:03', 'META', -1.1, 3.0, -1.35)] }
      ]
    };
  }
}
</script>
</body>
</html>
